<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Moletjie Stand Payment</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('payment.jpg'); /* Replace 'payment_background.jpg' with your image path */
            background-size: cover;
            background-position: center;
            color: #333;
        }

        header {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        section {
            background-color: rgba(255, 255, 255, 0.8); /* Add a semi-transparent white background */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            max-width: 500px;
            width: 100%;
        }

        section h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        section input[type="text"],
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: auto;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
           
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
    <script>
        function makePayment() {
            // Get payment amount and card details
            var paymentAmount = document.getElementById('paymentAmount').value;
            var cardNumber = document.getElementById('cardNumber').value;
            var expiryDate = document.getElementById('expiryDate').value;
            var cvv = document.getElementById('cvv').value;

            // Here, you would send the payment details to the server and process the payment
            // For now, we'll just display an alert to simulate successful payment
            alert("Payment of R" + paymentAmount + " successful!");

            // Generate payment slip/invoice (simulated)
            var currentDate = new Date().toLocaleDateString();
            var fullName = "John Doe"; // Replace with actual full name from database

            var paymentSlip = "Payment Slip\n\n" +
                              "Full Name: " + fullName + "\n" +
                              "Payment Amount: R" + paymentAmount + "\n" +
                              "Payment Date: " + currentDate;

            alert(paymentSlip);

            // Navigate back to the stand-details page
            window.location.href = "stand_details.html"; // Replace with the actual URL of the stand-details page
        }
    </script>
</head>
<body>
    <header>
        <h1>Make Payments</h1>
    </header>
    <main>
        <section>
            <h2>Payments</h2>
            <input type="text" id="paymentAmount" placeholder="Payment Amount" required>
            <input type="text" id="cardNumber" placeholder="Card Number" required>
            <input type="text" id="expiryDate" placeholder="Expiry Date (MM/YY)" required>
            <input type="text" id="cvv" placeholder="CVV" minlength="3" maxlength="3" required>
        </section>
        <button onclick="makePayment()">Pay Now</button>
    </main>
    <footer>
        <p>&copy; 2024 Moletjie Stand Payment. All rights reserved.</p>
    </footer>
</body>
</html>
