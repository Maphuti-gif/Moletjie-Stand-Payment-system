<body>
    <header>
        <h1>Register</h1>
    </header>
    <main>
        <form action="db_connection.php" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <input type="text" name="fullname" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="text" name="id_number" placeholder="ID Number" required>
            </div>
            <div class="form-group">
                <select name="section" required>
                    <option value="" disabled selected>Select Section</option>
                    <option value="Moletjie-Moshate">Moletjie-Moshate</option>
                    <option value="Ga-Semenya">Ga-Semenya</option>
                    <option value="Ga-Ramongwana">Ga-Ramongwana</option>
                    <option value="Ga-Mphahlele">Ga-Mphahlele</option>
                    <option value="Ga-Hlahla">Ga-Hlahla</option>
                    <option value="Ga-Makibelo">Ga-Makibelo</option>
                    <option value="Makgodu">Makgodu</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" name="stand_number" placeholder="Stand Number" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <input type="integer" name="Phone_Number" placeholder="Phone Number" required>
            </div>


            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div>
            <label for="profileImage">Proof Of Resident:</label>
                <input type="file" id="profileImage" name="profileImage" accept="image/*">

                </div>
            <!-- Upload Picture button -->
                     <div class="upload-button">
               
            </div>
   
            <!-- Register button -->
            <div class="register-button">
                <button type="submit">Register</button>
            </div>
        </form>
