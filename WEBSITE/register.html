<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Moletjie Stand Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('registers.jpg'); /* Replace 'register.jpg' with your background image URL */
            background-size: cover;
            background-position: center;
            color: #333;
        }

        header {
            background-color: #3f51b5;
            color: #fff;
            text-align: center;
            padding: 20px 0;
        }

        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form {
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        button,
        input[type="tel"] {
            width: calc(100% - 22px); /* Adjusted width */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        select {
            width: 100%; /* Ensure select element spans full width */
        }

        button {
            width: 100%; /* Make button span full width */
            background-color: #3f51b5;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #005da2;
        }

        .register-button {
            margin-top: 20px;
            text-align: center;
        }

        p {
            font-size: 14px;
        }

        footer {
            background-color: #3f51b5;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <header>
        <h1>Register</h1>
    </header>
    <main>
        <form action="login.html" method="POST">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="id_number">ID Number:</label>
                <input type="text" id="id_number" name="id_number" placeholder="Enter your ID number" pattern="[0-9]{13}" title="ID number must contain exactly 13 digits" required>
            </div>
            <div class="form-group">
                <label for="section">Section:</label>
                <select id="section" name="section" required>
                    <option value="" disabled selected>Select Section</option>
                    <option value="Moletjie-Moshate">Moletjie-Moshate</option>
                    <option value="Ga-Semenya">Ga-Semenya</option>
                    <option value="Ga-Ramongwana">Ga-Ramongwana</option>
                    <option value="Ga-Mphahlele">Ga-Mphahlele</option>
                    <option value="Ga-Hlahla">Ga-Hlahla</option>
                    <option value="Ga-Makibelo">Ga-Makibelo</option>
                    <option value="Makgodu">Makgodu</option>
                </select>
            </div>
            <div class="form-group">
                <label for="stand_number">Stand Number:</label>
                <input type="text" id="stand_number" name="stand_number" placeholder="Enter your stand number" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="Phone_Number">Phone Number:</label>
                <input type="tel" id="Phone_Number" name="Phone_Number" placeholder="Enter your phone number" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Password must contain at least one number, one uppercase and one lowercase letter, and at least 8 or more characters" required>
            </div>
            <div class="register-button">
                <button type="submit">Register</button>
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </form>
    </main>
    <footer>
        &copy; 2024 Moletjie Stand Payment. All rights reserved.
    </footer>
</body>
</html>
