<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Moletjie Stand Payment</title>
    <style>
         body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('logins.png'); 
            background-size: cover;
            background-position: center;
            color: #333;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 300px;
            padding: 35px;
            background-color: rgba(220, 220, 220, 0.9); 
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
        }

        .login-container h1 {
            font-size: 25px;
            text-align: center;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            font-size: 15px;
            font-weight: bold;
            display: block;
            margin-bottom: 1px;
        }

        .form-group input{
            width: calc(100% - 24px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group button {
            background-color: #3f51b5;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: calc(100% - 3px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
         .login-button {
            margin-top: 100px;
            text-align: center;
        }

        .form-group button:hover {
            background-color: #0056b3;

        }

        .form-group p {
            font-size: 14px;
            margin-top: 10px;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 14px;
        }/* Your CSS styles here */
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1>Login</h1>
            <form action="stand_details.html" method="POST">
                <div class="form-group">
                    <label for="id_number">ID Number</label>
                    <input type="text" id="id_number" name="id_number" placeholder="Enter your ID number" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <button type="submit">Login</button>
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                </div>
                <div class="form-group">
                    <a href="forgot_password.html">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>
    <footer class="footer">
        &copy; 2024 Moletjie Stand Payment. All rights reserved.
    </footer>
</body>
</html>
